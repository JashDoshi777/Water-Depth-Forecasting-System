# Docker Compose — Local Development
# Usage: docker-compose up --build

version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      - APP_ENV=development
    volumes:
      - ./backend:/app/backend
    restart: unless-stopped

